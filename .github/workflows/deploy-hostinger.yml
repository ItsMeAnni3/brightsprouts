# Deploy BrightSprouts to Hostinger over FTP whenever main changes.
#
# This keeps "git push" as the deploy button after the site leaves GitHub Pages. Until the three
# FTP secrets exist the job SKIPS rather than fails, so adding this file changes nothing today
# and shows no red crosses on the repo.
#
# Secrets to add (Settings > Secrets and variables > Actions > New repository secret):
#   FTP_HOST      the FTP IP or hostname shown in hPanel > Files > FTP Accounts.
#                 Use the IP. Do NOT use ftp.brightsprouts.academy: no such record exists,
#                 because DNS is at Porkbun and has no ftp subdomain.
#   FTP_USER      the FTP username from that page, usually of the form u123456789
#   FTP_PASSWORD  that account's password
#
# Optional:
#   FTP_DIR       the web root, only if it is not public_html/. Hostinger uses
#                 public_html/ for a primary domain but domains/<site>/public_html/
#                 when the site was added as an extra one. Check in File Manager; if the
#                 upload lands in the wrong folder every page 404s.
#
# Nobody but GitHub can read those once saved, including me.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: hostinger-deploy   # never let two uploads overlap and interleave files
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the FTP secrets exist
        id: gate
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No FTP_HOST secret set, so Hostinger is not configured yet. Skipping."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            # Default to the primary-domain web root, overridable without editing this file.
            echo "dir=${FTP_DIR:-public_html/}" >> "$GITHUB_OUTPUT"
            echo "Deploying to ${FTP_DIR:-public_html/}"
          fi

      - name: Check out the site
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Upload changed files
        if: steps.gate.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps                 # plain ftp would send the password in the clear
          local-dir: ./
          server-dir: ${{ steps.gate.outputs.dir }}   # public_html/ unless FTP_DIR overrides it
          # Only what changed is uploaded after the first run, so a normal deploy is seconds.
          exclude: |
            **/.git*
            **/.git*/**
            brand/**
            README.md
            APP-STORE.md
            books/*.raw.txt
