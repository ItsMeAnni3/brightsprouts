<script>
// Audit for the Unplugged tab added to Let's Learn Computer Science (LESSONS[17]).
// The brief was specific: 20 activities, no computer or internet anywhere in them, varying
// difficulty, clear materials and instructions, and no em dashes. Each of those is checked.
window.addEventListener("load", function () {
  var out = [], fails = 0;
  function ok(c, m) { if (!c) { fails++; out.push("FAIL: " + m); } else out.push("ok:   " + m); }
  var U = window.CS_UNPLUGGED;

  // ---------- 1. the collection ----------
  ok(!!U, "CS_UNPLUGGED exists");
  ok(U.length === 20, "there are " + U.length + " activities (expected 20)");

  var names = {}, dup = [];
  U.forEach(function (a) { var k = a.name.toLowerCase(); if (names[k]) dup.push(a.name); names[k] = 1; });
  ok(dup.length === 0, "every activity has its own name" + (dup.length ? ": " + dup.join(", ") : ""));

  var bad = U.filter(function (a) {
    return !a.name || !a.emoji || !a.teaches || !(a.mins > 0) ||
      ["Easy", "Medium", "Hard"].indexOf(a.level) < 0 ||
      !a.needs || a.needs.length < 1 || !a.steps || a.steps.length < 4;
  });
  ok(bad.length === 0, "every activity has a level, a time, what it teaches, materials and 4+ steps" +
    (bad.length ? " — bad: " + bad.map(function (a) { return a.name; }).join(", ") : ""));

  var byL = {};
  U.forEach(function (a) { byL[a.level] = (byL[a.level] || 0) + 1; });
  ok(byL.Easy >= 4 && byL.Medium >= 4 && byL.Hard >= 3,
     "difficulty varies — Easy " + byL.Easy + " · Medium " + byL.Medium + " · Hard " + byL.Hard);
  var steps = U.reduce(function (n, a) { return n + a.steps.length; }, 0);
  out.push("      " + steps + " steps in total, " + (steps / U.length).toFixed(1) + " per activity");

  var vague = U.filter(function (a) { return a.steps.some(function (s) { return s.trim().length < 15; }); });
  ok(vague.length === 0, "no instruction is too short to follow" +
    (vague.length ? ": " + vague.map(function (a) { return a.name; }).join(", ") : ""));

  // ---------- 2. the whole point: no computer, no internet ----------
  // Checked against the activity text, not the lesson prose, which is allowed to mention computers.
  var SCREEN = ["laptop", "tablet", "ipad", "phone app", "download", "website", "online",
                "google", "youtube", "scratch", "python", "click the", "log in", "wifi", "wi-fi",
                "browser", "keyboard", "printer", "print out", "software"];
  var plugged = [];
  U.forEach(function (a) {
    var text = (a.needs.join(" ") + " " + a.steps.join(" ") + " " + (a.tip || "")).toLowerCase();
    SCREEN.forEach(function (w) { if (text.indexOf(w) >= 0) plugged.push(a.name + " → " + w); });
  });
  ok(plugged.length === 0, "no activity needs a computer or the internet" +
    (plugged.length ? ": " + plugged.join(" | ") : ""));

  // Materials must be household. Anything here means a shopping trip.
  var BUY = ["micro:bit", "raspberry pi", "arduino", "robot kit", "app", "tablet", "batteries",
             "3d print", "laminator", "glue gun"];
  var pricey = [];
  U.forEach(function (a) {
    var t = a.needs.join(" ").toLowerCase();
    BUY.forEach(function (w) { if (t.indexOf(w) >= 0) pricey.push(a.name + " → " + w); });
  });
  ok(pricey.length === 0, "materials stay to things a family already has" +
    (pricey.length ? ": " + pricey.join(", ") : ""));

  // ---------- 3. no em dashes, as asked ----------
  // Checked across every field of every activity AND the lesson that introduces them.
  function emdash(s) { return String(s).indexOf("—") >= 0; }
  var dashed = [];
  U.forEach(function (a) {
    var fields = [a.name, a.teaches, a.tip || ""].concat(a.needs).concat(a.steps);
    if (fields.some(emdash)) dashed.push(a.name);
  });
  ok(dashed.length === 0, "no em dash in any activity" + (dashed.length ? ": " + dashed.join(", ") : ""));

  var L = LESSONS[17].unplugged;
  var lessonText = [L.title, L.intro, L.activity].concat(L.learn)
    .concat(L.questions.map(function (q) { return q.q + " " + q.a; }));
  var lessonDashed = lessonText.filter(emdash);
  ok(lessonDashed.length === 0, "no em dash in the lesson text either" +
    (lessonDashed.length ? ": " + lessonDashed.join(" | ") : ""));

  // ---------- 4. wired into the category ----------
  ok(!!L, "LESSONS[17].unplugged exists");
  var subs = subjectsFor(17);
  ok(subs.length === 12, "the CS tab bar now has " + subs.length + " tabs");
  ok(subs.some(function (s) { return s.key === "unplugged"; }), "one of them is the Unplugged tab");
  var missing = subs.filter(function (s) { return !LESSONS[17][s.key]; });
  ok(missing.length === 0, "every CS tab still has a lesson behind it" +
    (missing.length ? ": " + missing.map(function (s) { return s.key; }).join(", ") : ""));
  ok(L.unpluggedList === true, "the lesson is flagged so app.js renders the list");
  ok((L.questions || []).length >= 10, "the tab has " + (L.questions || []).length + " worksheet questions");

  // the questions must still be usable by the arcade's Code Cracker game
  function usable(x) {
    return x && x.q && x.a && String(x.a).length <= 30 &&
      !/^(e\.g\.|any\b|examples?\b)/i.test(x.a) && !/\bor\b.*\bor\b/i.test(x.a);
  }
  var fit = (L.questions || []).filter(usable).length;
  ok(fit >= 8, fit + " of the new questions also feed the Code Cracker arcade game");

  // ---------- 5. every activity has an illustration that actually draws ----------
  var noArt = U.filter(function (a) { return typeof a.art !== "function"; });
  ok(noArt.length === 0, "every activity has a picture" +
    (noArt.length ? " — missing: " + noArt.map(function (a) { return a.name; }).join(", ") : ""));
  var artBad = [], artThin = [];
  U.forEach(function (a) {
    if (typeof a.art !== "function") return;
    var svg;
    try { svg = a.art(); } catch (e) { artBad.push(a.name + " threw " + e.message); return; }
    if (!svg || svg.indexOf("<svg") < 0) { artBad.push(a.name + " drew nothing"); return; }
    if (/undefined|NaN/.test(svg)) { artBad.push(a.name + " has undefined/NaN in its SVG"); return; }
    var shapes = (svg.match(/<(rect|circle|ellipse|polygon|path|line|text)\b/g) || []).length;
    if (shapes < 5) artThin.push(a.name + "(" + shapes + ")");
  });
  ok(artBad.length === 0, "all 20 pictures draw without error" + (artBad.length ? " — " + artBad.join(" | ") : ""));
  ok(artThin.length === 0, "no picture is nearly empty" + (artThin.length ? " — " + artThin.join(", ") : ""));

  // and the browser must parse each one as a real laid-out SVG, not just a string of tags
  var host = document.createElement("div");
  host.style.width = "200px";
  document.body.appendChild(host);
  host.innerHTML = U.map(function (a) { return a.art(); }).join("");
  ok(host.querySelectorAll("svg").length === 20,
     "the browser parsed " + host.querySelectorAll("svg").length + " of 20 pictures as real SVG");
  host.remove();

  // ---------- 6. it renders ----------
  state.grade = 17; state.subject = "unplugged"; state.view = "lesson";
  var oldGrade = window.canGrade, oldSub = window.canSubject;
  canGrade = function () { return true; }; canSubject = function () { return true; };
  document.getElementById("app").innerHTML = lessonView();
  var items = document.querySelectorAll(".cu-item");
  ok(items.length === 20, "the page shows all " + items.length + " activities");
  ok(document.querySelectorAll(".cu-needs ul").length === 20, "every one lists its materials");
  ok(document.querySelectorAll(".cu-steps ol").length === 20, "every one lists its steps");
  var firstSteps = document.querySelectorAll(".cu-item")[0].querySelectorAll(".cu-steps li").length;
  ok(firstSteps === U[0].steps.length, "the first activity shows all " + firstSteps + " of its steps");
  ok(document.querySelectorAll(".cu-teaches").length === 20, "every one says which idea it teaches");
  ok(document.querySelectorAll(".cu-art svg").length === 20, "every one shows its illustration on the page");
  ok(/Practice Time/.test(document.getElementById("app").textContent),
     "the tab still generates its printable worksheet");
  canGrade = oldGrade; canSubject = oldSub;

  out.push("");
  out.push(fails ? "❌ " + fails + " FAILURES" : "✅ all checks passed");
  document.getElementById("results").textContent = out.join("\n");
  document.title = fails ? "FAIL " + fails : "PASS";
});
</script>
