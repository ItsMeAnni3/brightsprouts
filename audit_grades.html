<script>
window.addEventListener("load", function(){
  var out=[], fails=0;
  function ok(c,m){ if(!c){fails++; out.push("FAIL: "+m);} }
  (function () {
    var u = {}; u["audit@t.invalid"] = { name: "T", email: "audit@t.invalid", pass: "x", plan: "premium" };
    localStorage.setItem("bs_users", JSON.stringify(u));
    localStorage.setItem("bs_session", "audit@t.invalid");
    if (typeof loadSession === "function") loadSession();
    state.user = u["audit@t.invalid"];
  })();

  // tab bar has the folded-in subjects for every grade 1-12. Computer Science used to be one
  // of them and is now its own category, so it is checked separately above.
  ["english","books","create","engineer"].forEach(function(k){
    ok(subjectsFor(5).some(function(s){return s.key===k;}), "grade tab bar includes "+k);
  });
  // 15 since Cursive was added for Grades 2-5 (js/cursive.js). Grade 6 has no Cursive but gains
  // Biology, so checking both catches a subject being dropped from either band.
  ok(subjectsFor(5).some(function(s){return s.key==="cursive";}), "grade 5 tab bar includes cursive");
  ok(subjectsFor(6).every(function(s){return s.key!=="cursive";}), "cursive stops after grade 5");
  ok(subjectsFor(5).length===15, "grade 5 has 15 subject tabs (got "+subjectsFor(5).length+")");
  ok(subjectsFor(0).every(function(s){return s.key!=="compsci";}), "Kindergarten not affected");

  // The "Pick a Grade" subtitle lists the subjects by name. It advertised Computer Science long
  // after CS moved out into its own category, so check every name it prints is really a tab.
  (function () {
    var sub = (lessonsView().match(/Every grade now packs it all in:([^<,]*)/) || ["", ""])[1];
    var named = sub.split("•").map(function (x) { return x.trim(); }).filter(Boolean);
    ok(named.length >= 10, "the subtitle names the subjects (found " + named.length + ")");
    var labels = {};
    for (var g = 0; g <= 12; g++) subjectsFor(g).forEach(function (x) { labels[x.label] = 1; });
    named.forEach(function (n) {
      ok(!!labels[n], "subtitle names '" + n + "', which is really a grade tab");
    });
  })();
  ok(subjectsFor(13).every(function(s){return s.key!=="books";}), "General Knowledge not affected");

  // band mapping (progression)
  ok(LESSONS[1].compsci===LESSONS[17].cs12, "grade 1 CS = cs12 band");
  ok(LESSONS[4].compsci===LESSONS[17].cs35, "grade 4 CS = cs35 band");
  ok(LESSONS[7].compsci===LESSONS[17].cs68, "grade 7 CS = cs68 band");
  ok(LESSONS[11].compsci===LESSONS[17].cs912, "grade 11 CS = cs912 band");
  ok(LESSONS[2].books.booksBand==="1-2", "grade 2 books band 1-2");
  ok(LESSONS[5].books.booksBand==="3-5", "grade 5 books band 3-5");
  ok(LESSONS[9].books.booksBand==="9-12", "grade 9 books band 9-12");
  ok(LESSONS[1].english.engBand===0, "grade 1 english band 0");
  ok(LESSONS[6].english.engBand===2, "grade 6 english band 2");
  ok(LESSONS[12].english.engBand===3, "grade 12 english band 3");
  // Create tools are shared
  // These used to be one shared object. They are grade-banded now, so check instead that every
  // grade offering the tab has its own real lesson behind it.
  ["create","engineer"].forEach(function(k){
    for (var g = 0; g <= 12; g++) {
      if (!subjectsFor(g).some(function(x){ return x.key === k; })) continue;
      var L = LESSONS[g][k];
      ok(L && L.title && L.intro, "grade " + g + " " + k + " has its own lesson");
    }
  });

  // Computer Science is no longer folded into each grade. It lives in category 17 with the
  // Code Terminal and the unplugged activities, so check it there instead.
  ok(!LESSONS[4].compsci, "compsci is no longer a per-grade subject");
  ok(subjectsFor(4).every(function(x){ return x.key !== "compsci"; }), "no compsci tab on grade 4");
  ok(!!LESSONS[17], "Computer Science lives in category 17");
  var csKey = Object.keys(LESSONS[17])[0];
  var qs = makeSheet(17, csKey, LESSONS[17][csKey]);
  ok(Array.isArray(qs), "category 17 makeSheet('"+csKey+"') returns an array");

  // grade lessons render without throwing for every folded-in subject
  ["english","books","create","engineer"].forEach(function(k){
    try { state.grade=5; state.subject=k; state.sheetCache={}; var h=lessonView();
      ok(h.length>200, "lessonView(grade5,"+k+") renders");
    } catch(e){ fails++; out.push("FAIL render "+k+": "+e.message); }
  });
  // english shows only ONE band (grade 5 = band 1 = 'Fluent and Curious'); books shows only 3-5 band
  try { state.grade=5; state.subject="english"; var he=lessonView();
    ok(he.indexOf("Fluent")>=0, "grade 5 English shows its band");
    ok(he.indexOf("Analysis and Persuasion")<0, "grade 5 English does NOT show other bands");
  } catch(e){ fails++; out.push("FAIL english band: "+e.message); }
  try { state.grade=1; state.subject="books"; var hb=lessonView();
    ok(hb.indexOf("Grades 1")>=0 && hb.indexOf("Grades 9")<0, "grade 1 Books shows only the 1-2 band");
  } catch(e){ fails++; out.push("FAIL books band: "+e.message); }

  // Pick-a-Grade grid no longer shows the 4 standalone tiles, but keeps grades + specials
  try { var lv=lessonsView();
    ok(lv.indexOf("openGrade(16)")<0 && lv.indexOf("openGrade(18)")<0, "retired Create/English tiles stay out of the grid");
    ok(lv.indexOf("openGrade(17)")>=0, "Computer Science has its own tile now");
    ok(lv.indexOf("openGrade(5)")>=0 && lv.indexOf("openGrade(13)")>=0 && lv.indexOf("openGrade(19)")>=0, "grades + General + History tiles remain");
  } catch(e){ fails++; out.push("FAIL grid: "+e.message); }

  out.unshift(fails===0 ? "PASS all grade-fold checks" : ("FAILURES: "+fails));
  document.getElementById("results").textContent = out.join("\n");
});
